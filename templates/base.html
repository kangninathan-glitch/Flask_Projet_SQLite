<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Bibliothèque{% endblock %}</title>

    <!-- BOOTSTRAP MODERNE -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>
      body {
        padding: 30px;
        background: #f5f7fa;
      }
      .navbar {
        margin-bottom: 30px;
      }
      table {
        background: white;
      }
      th {
        background: #343a40;
        color: white;
      }
    </style>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">📚 Bibliothèque</a>

    <div>
      <a class="btn btn-outline-light btn-sm" href="/books">Livres</a>
      <a class="btn btn-outline-light btn-sm" href="/loans">Mes emprunts</a>
      <a class="btn btn-outline-light btn-sm" href="/logout">Déconnexion</a>
      <a class="btn btn-outline-light btn-sm" href="/tasks">Tâches</a>

    </div>
  </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
